name: budgeteer

services:
  budget-server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      DATABASE_NAME: budgetapp
      DATABASE_SSLMODE: disable
      BROWSER_URL: http://chromium:9222
    networks:
      - default
      - browser
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      chromium:
        condition: service_started

  # Only reaches the internet through budget-server's egress proxy: keep it on the internal network alone.
  chromium:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: chromium
    networks:
      - browser
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: budgetapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

networks:
  browser:
    internal: true

volumes:
  postgres_data:
