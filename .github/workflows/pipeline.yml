name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Trivy filesystem scan
        run: make trivy-fs TRIVY_EXIT=0

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t budgeteer:ci .

      - name: Trivy image scan
        run: make trivy-image IMAGE=budgeteer:ci TRIVY_EXIT=0
